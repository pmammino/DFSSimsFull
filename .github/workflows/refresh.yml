# Scheduled "morning refresh": rebuild the projections (Stage B — the SLOW step)
# and the correlated sims (Stage C) every morning and publish the artifacts to
# the object store (R2/S3). The Streamlit app pulls the new build on load / next
# Run (gated on the build stamp), so an interactive Run finds today's projections
# already built and NEVER has to run Stage B itself — the only thing a Run may
# still do is a fast Stage C re-sim if lineups have moved.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SHARED_STORE_BUCKET, SHARED_STORE_ENDPOINT (for R2), SHARED_STORE_PREFIX (opt),
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION (opt)
name: refresh-sims

on:
  schedule:
    # 09:17 UTC ≈ 5am ET — rebuild projections early so they're ready well
    # before the day's users arrive. Projections don't need posted lineups, so
    # building this early is safe and gives the biggest head start. (Cron is
    # fixed UTC; this lands at 5am during EDT / 4am during EST.)
    #
    # Deliberately NOT on the hour: GitHub documents that schedule events are
    # delayed during high-load periods, "including the start of every hour",
    # and recommends picking a non-round minute to reduce queueing delay. The
    # previous "0 11 * * *" (top of the hour) drifted from ~30min late in
    # early runs to >10 hours late by late August, pushing the "morning"
    # refresh into the afternoon. Moving off :00 and building in a 2-hour
    # earlier buffer gives slack for GitHub's scheduler jitter without
    # changing when users actually see fresh data.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "what to rebuild"
        default: "projections"
        type: choice
        options:
          # projections: Stage B + C, reusing the committed BIP inputs (default,
          #   reliable — no Statcast scrape). This is what the schedule runs.
          # sims:        Stage C only — fast re-sim from existing projections.
          # full:        Stage A + B + C, including the heavy Statcast BIP scrape
          #   (use to refresh the underlying BIP data, e.g. weekly).
          - projections
          - sims
          - full

concurrency:
  group: refresh-sims
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHARED_STORE_BUCKET: ${{ secrets.SHARED_STORE_BUCKET }}
      SHARED_STORE_ENDPOINT: ${{ secrets.SHARED_STORE_ENDPOINT }}
      SHARED_STORE_PREFIX: ${{ secrets.SHARED_STORE_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pipeline dependencies (heavy — xgboost/sklearn/pybaseball)
        run: pip install -r requirements.txt

      - name: Pull current artifacts from the store (warm start)
        run: python scripts/push_artifacts.py --check || true

      - name: Rebuild
        run: |
          # Scheduled runs have no dispatch input → default to rebuilding
          # projections so the slow Stage B is done every morning.
          STAGE="${{ github.event.inputs.stage }}"
          if [ -z "$STAGE" ]; then STAGE="projections"; fi
          echo "Rebuild stage: $STAGE"
          case "$STAGE" in
            full)        python refresh_and_run.py ;;            # Stage A+B+C (BIP scrape)
            projections) python refresh_and_run.py --skip-bip ;; # Stage B+C, reuse BIP
            sims)        python run_slate.py ;;                  # Stage C only
          esac
          # remember which stage ran so the stamp step knows if Stage B rebuilt
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Stamp the build (freshness signal the app reads)
        run: |
          # Mark projections fresh only when Stage B actually ran, so an
          # interactive Run skips Stage B today; a sims-only run just refreshes
          # the slate signature.
          if [ "$STAGE" = "sims" ]; then
            python scripts/stamp_build.py
          else
            python scripts/stamp_build.py --projections
          fi

      - name: Refresh projected ownership (only when the player pool changed)
        run: |
          # Precompute expected ownership from the freshly built sims so the app
          # doesn't recompute it on every interactive run. The script fingerprints
          # the slate's player pool and SKIPS the recompute when nothing moved, so
          # a sims-only re-run with the same players costs nothing here.
          python scripts/build_ownership.py

      - name: Publish artifacts to the object store
        run: |
          # Publishing is only possible when an object store is configured. If
          # the SHARED_STORE_* secrets aren't set, don't fail the whole job —
          # warn (visible on the run) and exit cleanly. Note: without a store the
          # rebuilt artifacts stay on the ephemeral runner and can't reach the
          # app, so set the secrets (see DEPLOYMENT.md, Step 2) to make the
          # scheduled refresh actually feed the app.
          if [ -z "$SHARED_STORE_BUCKET" ]; then
            echo "::warning title=No object store configured::SHARED_STORE_BUCKET is not set — the rebuilt projections/sims were NOT published and won't reach the app. Add the SHARED_STORE_*/AWS_* repository secrets (Settings → Secrets and variables → Actions) to enable publishing."
            exit 0
          fi
          python scripts/push_artifacts.py
