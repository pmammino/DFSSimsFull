# Scheduled "morning refresh": rebuild projections + correlated sims and publish
# the artifacts to the object store (R2/S3). The deployed worker pulls the new
# build on its next request (gated on the build stamp), so the web app serves
# fresh sims without a human running the pipeline.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SHARED_STORE_BUCKET, SHARED_STORE_ENDPOINT (for R2), SHARED_STORE_PREFIX (opt),
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION (opt)
name: refresh-sims

on:
  schedule:
    # 13:00 UTC ≈ 9am ET — after morning lineups/Vegas are typically posted.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "full (Stage A+B+C) or sims (Stage C only)"
        default: "sims"
        type: choice
        options: [sims, full]

concurrency:
  group: refresh-sims
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHARED_STORE_BUCKET: ${{ secrets.SHARED_STORE_BUCKET }}
      SHARED_STORE_ENDPOINT: ${{ secrets.SHARED_STORE_ENDPOINT }}
      SHARED_STORE_PREFIX: ${{ secrets.SHARED_STORE_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pipeline dependencies (heavy — xgboost/sklearn/pybaseball)
        run: pip install -r requirements.txt

      - name: Pull current artifacts from the store (warm start)
        run: python scripts/push_artifacts.py --check || true

      - name: Rebuild
        run: |
          if [ "${{ github.event.inputs.stage }}" = "full" ]; then
            python refresh_and_run.py
          else
            # Stage C only: re-sim today's slate from existing projections.
            python run_slate.py
          fi

      - name: Publish artifacts to the object store
        run: python scripts/push_artifacts.py
