# One-off rebuild of the per-PA baselines and the season layer.
#
# Run it from Actions → "refresh-projections" → "Run workflow". Manual only,
# no schedule: this regenerates the projection BASELINES, which is an
# occasional, deliberate act (after a pipeline fix, or once the season's data
# is complete), not a daily chore.
#
# Distinct from `refresh-sims`, which is the daily job: that one rebuilds
# projections AND the slate/sims for the DFS app and publishes to the object
# store. This one does the projection side only, then verifies the result and
# builds the season layer on top:
#
#   1. run_pipeline.py            per-PA baselines -> out/*.csv
#   2. scripts/verify_refresh.py  ASSERT the known defects are actually gone
#   3. audit_baselines.py         full diagnostic, written to the run summary
#   4. season_engine.py           team context, wins, save/hold pools
#   5. build_role_templates.py    role workbooks against the fresh projections
#
# Step 2 is the point of the workflow. The committed artifacts pre-date the
# extra-base-hit and team-identity fixes, so "the pipeline ran without
# crashing" is not evidence the refresh worked. verify_refresh compares the
# rebuilt output against real batted-ball data in bip_inputs/ and FAILS the job
# if extra-base hits are still suppressed, if the 30 clubs are not distinct, or
# if the playing-time tiers are missing.
#
# Outputs are uploaded as a run artifact and, by default, pushed to a new
# branch so they can be reviewed before touching main. Publishing to the
# object store (which feeds the live app) is opt-in.

name: refresh-projections

on:
  workflow_dispatch:
    inputs:
      target_year:
        description: "season to project"
        default: "2027"
        type: string
      scrape_bip:
        description: "re-scrape Statcast batted-ball data, replacing bip_inputs/ (slow, ~10min)"
        default: false
        type: boolean
      force:
        description: "bypass caches and re-fetch every source"
        default: false
        type: boolean
      commit:
        description: "what to do with the rebuilt files"
        default: branch
        type: choice
        options:
          # branch: push to refresh/projections-<year>-<run> for review (default)
          # none:   leave them on the run artifact only
          - branch
          - none
      publish:
        description: "also publish to the object store (feeds the LIVE app)"
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Never let two rebuilds race: they write the same out/ files and would
  # interleave. Queue rather than cancel — a half-finished rebuild is worse
  # than a late one.
  group: refresh-projections
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The pipeline itself is ~6 minutes, but the BIP imputation and XGBoost
    # training are the slow parts, a cold runner installing xgboost/sklearn
    # adds several more, and a --refresh-bip run scrapes Statcast day by day on
    # top of that. 120 leaves room for all three.
    timeout-minutes: 120
    env:
      TARGET_YEAR: ${{ inputs.target_year }}
      SHARED_STORE_BUCKET: ${{ secrets.SHARED_STORE_BUCKET }}
      SHARED_STORE_ENDPOINT: ${{ secrets.SHARED_STORE_ENDPOINT }}
      SHARED_STORE_PREFIX: ${{ secrets.SHARED_STORE_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (heavy — xgboost/sklearn/pybaseball)
        run: |
          pip install -r requirements.txt
          pip install pytest          # dev-only; not a runtime dependency

      - name: Run the test suite first
        run: |
          # Cheap (~10s) relative to a 6-minute pipeline run, and it catches a
          # broken merge before we spend the time. The blend-weight and
          # team-context tests here guard the exact bugs this refresh exists to
          # eliminate, so a red suite means the rebuild would bake them back in.
          python -m pytest tests/ -q

      - name: Rebuild the per-PA baselines
        run: |
          ARGS="--target-year $TARGET_YEAR --bip-dir bip_inputs --output-dir out"
          if [ "${{ inputs.scrape_bip }}" = "true" ]; then
            # --refresh-bip, NOT merely omitting --skip-2026-scrape. Because
            # bip_inputs/bip_<year-1>.csv is committed, the pipeline's own
            # "scrape if absent" path never fires, so omitting the skip flag
            # would have produced a run that looked like it refreshed the
            # batted-ball data and silently reused the stale file. Power and
            # BABIP come off these batted balls, so that matters.
            ARGS="$ARGS --refresh-bip"
          else
            # Reuse the committed batted-ball CSVs. Explicit, so the run does
            # not depend on baseballsavant being reachable at all.
            ARGS="$ARGS --skip-2026-scrape"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "run_pipeline.py $ARGS"
          python run_pipeline.py $ARGS

      - name: Verify the rebuild (fails the job if a known defect survived)
        run: |
          # THE gate. Capture to a file rather than piping to tee: a pipeline's
          # exit status is tee's, so `... | tee` would report success no matter
          # what the verifier found and the gate would never fire.
          set +e
          python scripts/verify_refresh.py --target-year "$TARGET_YEAR" \
            > verify.txt 2>&1
          STATUS=$?
          set -e
          cat verify.txt
          {
            echo "## Refresh verification"
            echo '```'
            cat verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Baseline audit (diagnostic, never fails the job)
        if: always()
        run: |
          # The full 7-check audit. Informational — verify_refresh is what
          # gates. `|| true` so a diagnostic problem cannot mask the real
          # result above.
          {
            echo "## Baseline audit"
            echo '```'
            python deliverables/projection_engine/audit_baselines.py 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the season layer (team context, wins, save/hold pools)
        run: |
          # Same reason as above: capture, then propagate the real exit status
          # instead of letting a pipe hide a failure.
          set +e
          python season_engine.py --target-year "$TARGET_YEAR" > season.txt 2>&1
          STATUS=$?
          set -e
          cat season.txt
          {
            echo "## Season layer"
            echo '```'
            cat season.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Regenerate the role workbooks
        run: |
          # The Suggested Role column is derived from the projections, so it
          # improves once these are built from a complete season rather than
          # the partial one the committed artifacts used.
          python scripts/build_role_templates.py --target-year "$TARGET_YEAR"

      - name: Upload the rebuilt files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projections-${{ inputs.target_year }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            out/*.csv
            out/season_*/
            rosters/player_roles_*.xlsx
            bip_inputs/*.csv

      - name: Push the rebuilt files to a branch
        if: inputs.commit == 'branch'
        run: |
          BRANCH="refresh/projections-${TARGET_YEAR}-${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # out/season_*/ is gitignored (derived in seconds from the CSVs), so
          # only the committed artifact set moves here. bip_inputs/ is included
          # because --refresh-bip rewrites the batted-ball CSV in place, and
          # that refreshed data is the whole point of a scraping run — without
          # committing it the next non-scraping run falls back to the partial
          # season again.
          git add -A out rosters/player_roles_*.xlsx bip_inputs
          if git diff --cached --quiet; then
            echo "::notice title=No changes::the rebuild produced identical files"
            exit 0
          fi
          git commit -m "Rebuild ${TARGET_YEAR} projections (run ${{ github.run_id }})

          Regenerated by .github/workflows/refresh-projections.yml.
          Verification and the full baseline audit are in the run summary:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for i in 1 2 3 4; do
            git push -u origin "$BRANCH" && break
            echo "push failed, retry $i"; sleep $((2 ** i))
          done
          {
            echo "## Rebuilt files pushed"
            echo "Branch \`$BRANCH\` — [open a pull request](${{ github.server_url }}/${{ github.repository }}/compare/$BRANCH?expand=1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the object store (feeds the live app)
        if: inputs.publish
        run: |
          if [ -z "$SHARED_STORE_BUCKET" ]; then
            echo "::error title=No object store configured::publish was requested but SHARED_STORE_BUCKET is not set. Add the SHARED_STORE_*/AWS_* repository secrets (see DEPLOYMENT.md, Step 2)."
            exit 1
          fi
          python scripts/push_artifacts.py
          # Mark the projections fresh so the app stops rebuilding Stage B.
          python scripts/stamp_build.py --projections
          echo "::warning title=Live app updated::the rebuilt projections are now serving. Power rises ~19% versus the pre-fix baselines, which moves DFS scoring and ownership — re-validate against deliverables/sim_review/ and rebuild sims."
